name: build
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
      - "libraries.properties"
      - "build.sh"
    tags:
      - "*"

jobs:
  build-linux:
    runs-on: ${{ matrix.platform.host }}
    container:
      image: ${{ matrix.platform.container }}
    strategy:
      matrix:
        platform:
          - name: linux-x86_64
            container: ghcr.io/pytgcalls/ntgcalls/manylinux-x86_64:latest
            host: ubuntu-latest
          - name: linux-arm64
            container: ghcr.io/pytgcalls/ntgcalls/manylinux-arm64:latest
            host: ubuntu-24.04-arm
          - name: muslinux-x86_64
            container: ghcr.io/pytgcalls/ntgcalls/muslinux-x86_64:latest
            host: ubuntu-latest
          - name: muslinux-arm64
            container: ghcr.io/pytgcalls/ntgcalls/muslinux-arm64:latest
            host: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Mesa Libraries
        run: bash build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for artifact
        run: tar -czvf mesa.${{ matrix.platform.name }}.tar.gz artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mesa.${{ matrix.platform.name }}.tar.gz
          path: mesa.${{ matrix.platform.name }}.tar.gz

  create-release:
    name: Create Release
    if: contains(github.ref, 'tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/download
        with:
          platform: linux-x86_64
      - uses: ./.github/actions/download
        with:
          platform: linux-arm64
      - uses: ./.github/actions/download
        with:
          platform: muslinux-x86_64
      - uses: ./.github/actions/download
        with:
          platform: muslinux-arm64
      - name: Env to output
        run: |
          echo "package_paths<<EOF" >> $GITHUB_OUTPUT
          cat package_paths.env >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: env
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.env.outputs.package_paths }}